<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 260px; padding: 12px; font-family: sans-serif; }
    h4 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #666; }
    button.action { width: 100%; padding: 8px; cursor: pointer; margin-bottom: 4px; }
    .snippet-btn {
      display: block; width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px;
      cursor: pointer; background: #f2f2f2; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;
    }
    .snippet-btn:hover { background: #e6e6e6; }
    .empty { font-size: 12px; color: #888; }
    a { font-size: 12px; }
  </style>
</head>
<body>
  <h4>Save</h4>
  <button class="action" id="saveBtn">Salvar HTML</button>
  <div style="font-size:11px;color:#999;margin-bottom:4px;">Coleta html mesmo quando contem um "show more".</div>

  <h4>Snippets</h4>
  <div id="snippetList" class="empty">Nenhum Snippet Ainda.</div>
  <a href="#" id="openOptions">Gerenciar Snippets</a>

  <script src="popup.js"></script>
</body>
</html>
